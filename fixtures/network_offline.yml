# No guest network at all, only host-to-guest SSH: softnet deny-all on a Mac
# with a managed softnet (backend auto), tart --net-host elsewhere.
# For script provisioners that need no network access.
runners:
  - name: offline-build
    vm:
      source:
        type: local
        name: golden
      run:
        network:
          profile: offline
    provisioner:
      type: script
      config:
        run: echo "no network needed"
