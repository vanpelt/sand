# Zero-config secure networking: no vm.run.network key is the same as
# `network: { profile: github, backend: hostOnly }`. Tart's host-only network
# (`--net-host`, no root) removes every direct route off the host, and the guest
# reaches only GitHub (plus the github preset's CDN/blob hosts) through Sand's
# host-side allowlisting HTTPS proxy over an SSH reverse tunnel. No host setup.
runners:
  - name: secure-default
    vm:
      source:
        type: oci
        image: ghcr.io/cirruslabs/macos-runner:golden-gate
    provisioner:
      type: github
      config:
        appId: 123456
        organization: my-org
        privateKeyKeychainLabel: sand-github-app
        runnerName: secure-default
