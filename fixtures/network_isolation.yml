# Legacy explicit mode: softnet deny-all plus direct IPv4 allows (all ports).
# Sand also allows host-to-guest SSH (`in proto tcp @host port <ssh port>`).
# Prefer the default `profile: github`; this mode is for an externally run,
# dedicated egress proxy. Replace the EXAMPLE address before running.
runners:
  - name: restricted-prototype
    vm:
      source:
        type: local
        name: golden
      mounts: []
      run:
        noGraphics: true
        noClipboard: true
        nested: false
        network:
          mode: restricted
          allowCIDRs:
            - 10.42.10.25/32 # EXAMPLE ONLY: dedicated egress proxy
    provisioner:
      type: script
      config:
        run: echo "network policy prototype"
