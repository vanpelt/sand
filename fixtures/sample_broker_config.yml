# Broker mode (docs/adr/0001-job-admission.md, docs/broker-api.md).
# Sand holds no GitHub App key: it authenticates to the broker as a device,
# receives a single-use JIT runner, and every acquired job must pass the
# broker's admission policy before any workflow code runs.
# Create the device key with: sand broker keygen --device-id dev-laptop
runners:
  - name: laptop-runner
    stopAfter: 1
    vm:
      source:
        type: oci
        image: ghcr.io/cirruslabs/macos-runner:tahoe
      run:
        network:
          profile: github
    provisioner:
      type: github
      config:
        organization: example-org
        repository: example-repo
        runnerName: laptop-runner
        broker:
          # https is required; plain http only for a loopback mock broker.
          url: http://127.0.0.1:8787
          deviceId: dev-laptop
          deviceKeyPath: ~/.sand/broker/dev-laptop.key.pem
    healthCheck:
      command: "pgrep -fl /Users/admin/actions-runner/run.sh"
      interval: 30
      delay: 60
