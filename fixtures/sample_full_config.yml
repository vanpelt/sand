runners:
  - name: runner-1
    stopAfter: null
    vm:
      source:
        type: oci
        image: "ghcr.io/cirruslabs/ubuntu:latest"
      hardware:
        ramGb: null
        cpuCores: null
        display:
          width: 1280
          height: 720
          unit: null
          refit: null
        audio: null
      mounts:
        - host: ~/ci-cache
          name: cache
          mode: rw
      run:
        noGraphics: true
        noClipboard: false
        nested: false
        rootDiskOpts: null
        # Host mounts and the clipboard need unrestricted shared NAT; this is an
        # explicit opt-out of the secure default and logs a warning on every boot.
        network:
          mode: shared
      diskSizeGb: null
      ssh:
        user: admin
        password: admin
        port: 22
        connectMaxRetries: null
    provisioner:
      type: script
      config:
        run: |
          echo "Hello World from runner 1"
    preRun: |
      echo "pre-run for runner 1"
    postRun: |
      echo "post-run for runner 1"
    healthCheck:
      command: "true"
      interval: 30
      delay: 60
  - name: runner-2
    stopAfter: null
    vm:
      source:
        type: oci
        image: "ghcr.io/cirruslabs/ubuntu:latest"
      cache:
        host: ~/.cache/sand/actions-runner
      run:
        noGraphics: true
        # Omitting network is the same as profile: github. Written out in full here.
        network:
          profile: github          # github (default) | offline
          presets: [npm, pypi]     # extra built-in domain bundles
          allowedDomains:          # user additions; port defaults to 443
            - registry.example-artifacts.com
            - "*.cdn.example.com"
            - "git.example.org:8443"
          allowGitHubSSH: false    # reserved; HTTPS checkout only
          verify: basic            # basic (default) | strict
          transport: tunnel        # tunnel (default); gateway is reserved
          backend: softnet         # auto (default: managed softnet if safely installed, else hostOnly) | hostOnly (no root) | softnet (privileged softnet)
          softnetPath: /usr/local/libexec/sand/softnet  # optional; default: this managed path, then PATH. Must be root-owned all the way up (P12)
          softnetSHA256: 2ea5572268f814317bc3944d1352032f1f4dafe00bfe453eefc64e9dc32627a3  # optional pin (softnet 0.26.0), checked before every VM (P13)
          hostListeners: warn      # hostOnly only: warn (default) | deny host services reachable on the bridge
          acceptedHostListeners: []  # with deny: accepted exposures, e.g. [tcp/7000, udp/5353, udp/*]
          tlsInspection: fail      # fail (default) | trustHostCA: trust the host's TLS-inspection CA in the guest
          maxEnforcementFailures: 3  # consecutive enforcement failures before sand run exits 78
          quietOSBackground: true  # default: deny macOS background endpoints quietly (debug log, counted); false logs them as warnings
          quietDenies:             # extra names whose denies are logged at debug and counted (still denied)
            - "*.telemetry.example.com"
          requireSteering: false   # default; true refuses steered GitHub names that resolve only to public addresses
          allowedCIDRs:            # expert escape hatch (softnet backend only): direct allows that bypass the proxy
            - cidr: 203.0.113.10/32
              port: 443
              proto: tcp
      ssh:
        user: admin
        password: admin
        port: 22
        connectMaxRetries: null
    provisioner:
      type: github
      config:
        appId: 123456
        organization: my-org
        repository: null
        privateKeyPath: ~/my-app.private-key.pem
        privateKeyKeychainLabel: null
        runnerName: runner-2
        extraLabels: null
        runnerGroup: null
        # Broker mode (ADR 0001) replaces appId/privateKey*/extraLabels/runnerGroup and
        # is mutually exclusive with them; see fixtures/sample_broker_config.yml.
        broker: null
    healthCheck:
      command: "pgrep -fl /Users/admin/actions-runner/run.sh"
      interval: 30
      delay: 60
